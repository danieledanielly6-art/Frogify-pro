<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogify Pro 🐸</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon: #00ff66; 
            --bg: #050505; 
            --surface: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --muted: #888;
        }

        /* Temas */
        body.ocean { --neon: #00d4ff; --bg: #050a14; }
        body.midnight { --neon: #b300ff; --bg: #0a0514; }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
            color: var(--text);
            background: linear-gradient(-45deg, #050505, #0a140f, #050505, #001a0a);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Barra Lateral (Aside) */
        aside { 
            width: 380px; 
            padding: 30px;
            display: flex; 
            flex-direction: column; 
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px); 
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        h1 { font-weight: 700; letter-spacing: -1px; margin-bottom: 20px; color: var(--neon); }

        .theme-picker { display: flex; gap: 12px; margin-bottom: 20px; }
        .theme-btn { 
            width: 20px; height: 20px; border-radius: 50%; 
            border: 2px solid transparent; cursor: pointer; transition: 0.3s;
        }
        .theme-btn:hover { transform: scale(1.2); }
        .theme-btn.active { border-color: white; transform: scale(1.2); }

        .controls-panel { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }

        input, select { 
            background: var(--surface); border: 1px solid rgba(255,255,255,0.1); 
            padding: 10px; border-radius: 8px; color: white; transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--neon); background: rgba(0,255,102,0.05); }

        button { 
            background: var(--neon); color: black; border: none; 
            padding: 10px; border-radius: 8px; font-weight: 700; 
            cursor: pointer; transition: transform 0.1s ease, background 0.3s ease;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.95); }

        /* Lista de Músicas */
        #playlist { flex-grow: 1; overflow-y: auto; margin-top: 10px; }
        .item { 
            padding: 10px; background: transparent; margin-bottom: 4px; 
            border-radius: 8px; display: flex; align-items: center; 
            cursor: pointer; border: 1px solid transparent; transition: all 0.3s;
        }
        .item:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); }
        .item.active { background: rgba(255, 255, 255, 0.1); border-left: 4px solid var(--neon); }
        .item img { width: 50px; height: 35px; object-fit: cover; border-radius: 4px; margin-right: 12px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon); }

        /* Main (Vídeo) */
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #video-container { 
            position: relative; width: 70%; aspect-ratio: 16/9; 
            border-radius: 20px; overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1;
        }
        #video-container::before {
            content: ""; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            background: var(--neon); filter: blur(50px); opacity: 0.3; z-index: -1; border-radius: 16px;
        }
        iframe { width: 100%; height: 100%; }

        /* Visualizer */
        .visualizer { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 40px; margin-top: 20px; }
        .bar { width: 6px; height: 10px; background: var(--neon); border-radius: 3px; animation: sound 1.5s infinite ease-in-out; }
        @keyframes sound { 0% { height: 10px; opacity: 0.3; } 50% { height: 40px; opacity: 1; } 100% { height: 10px; opacity: 0.3; } }
        .bar:nth-child(1) { animation-delay: 0.1s; } .bar:nth-child(2) { animation-delay: 0.2s; } .bar:nth-child(3) { animation-delay: 0.3s; } .bar:nth-child(4) { animation-delay: 0.4s; } .bar:nth-child(5) { animation-delay: 0.5s; } .bar:nth-child(6) { animation-delay: 0.6s; } .bar:nth-child(7) { animation-delay: 0.7s; } .bar:nth-child(8) { animation-delay: 0.8s; }

        /* Customizar o Select */
        select { appearance: none; -webkit-appearance: none; -moz-appearance: none; background-color: var(--surface); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 14px;
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 10px center;
                background-size: 16px;}

        select:focus { outline: none; border-color: var(--neon); }

        /* --- NOVOS TEMAS --- */
        body.cyberpunk { --neon: #ff00ff; background: linear-gradient(45deg, #2b0033, #001a1a); }
        body.forest { --neon: #7cfc00; background: linear-gradient(45deg, #051a05, #1a1a05); }
        body.space { --neon: #00d4ff; background: linear-gradient(45deg, #05051a, #1a051a); }

        /* --- MASCOTE DANÇANTE --- */
        #dancing-frog { 
            display: inline-block; 
            margin-left: 10px; 
            animation: dance 0.5s infinite alternate ease-in-out; 
            cursor: pointer;
        }

        @keyframes dance { 
            0% { transform: translateY(0) rotate(-5deg); } 
            100% { transform: translateY(-10px) rotate(5deg) scale(1.1); } 
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            aside { width: 100%; height: auto; padding: 20px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            main { padding: 20px 0; width: 100%; align-items: center; }
            #video-container { width: 90%; aspect-ratio: 16/9; }
            button { padding: 15px; }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</head>
<body>

    <aside>
        <h1>Frogify <span id="dancing-frog">🐸</span></h1>
        
        <div class="theme-picker">
            <button class="theme-btn active" style="background: #00ff66;" onclick="trocarTema('', this)"></button>
            <button class="theme-btn" style="background: #00d4ff;" onclick="trocarTema('ocean', this)"></button>
            <button class="theme-btn" style="background: #b300ff;" onclick="trocarTema('midnight', this)"></button>
            <button class="theme-btn" style="background: #ff00ff;" onclick="trocarTema('cyberpunk', this)"></button>
            <button class="theme-btn" style="background: #7cfc00;" onclick="trocarTema('forest', this)"></button>
            <button class="theme-btn" style="background: #00008b;" onclick="trocarTema('space', this)"></button>
        </div>
        
        <div class="controls-panel">
            <select id="playlist-selector" onchange="mudarPlaylist()"></select>
            <input type="text" id="new-playlist-name" placeholder="Nome da nova playlist...">
            <button onclick="criarPlaylist()">+ Criar Playlist</button>
        </div>

        <input type="text" id="search-input" placeholder="🔍 Buscar na playlist..." oninput="renderizarItens()">
        <input type="text" id="input-link" placeholder="Cole o link aqui...">
        <button onclick="adicionarLink()" style="width: 100%; margin-top: 5px;">Adicionar Música</button>
        
        <div id="playlist"></div>

        <div class="backup-btns" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
            <button class="btn-small" style="background: #333; color: white;" onclick="exportarBackup()">Exportar .json</button>
            <button class="btn-small" style="background: #333; color: white;" onclick="document.getElementById('file-import').click()">Importar .json</button>
            <input type="file" id="file-import" style="display:none" onchange="importarBackup(event)">
        </div>
        
        <button onclick="limparPlaylist()" style="margin-top:10px; background: transparent; color: #ff4444; border: 1px solid #ff4444;">Limpar Playlist</button>
    </aside>

    <main>
        <div id="video-container">
            <iframe id="player" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        
        <div class="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 20px;">
            <button onclick="tocarAnterior()">◀ Anterior</button>
            <button onclick="tocarProximo()">Próximo ▶</button>
        </div>
        <p id="status" style="margin-top: 20px; color: var(--muted);">Pronto.</p>
    </main>

    <script>
        let allPlaylists = JSON.parse(localStorage.getItem('frogify_all')) || { "Geral": [] };
        let playlistAtualNome = Object.keys(allPlaylists)[0];
        let indexAtual = -1;

        function salvar() { localStorage.setItem('frogify_all', JSON.stringify(allPlaylists)); }

        function renderizarPlaylists() {
            const selector = document.getElementById('playlist-selector');
            selector.innerHTML = Object.keys(allPlaylists).map(name => 
                `<option value="${name}" ${name === playlistAtualNome ? 'selected' : ''}>${name}</option>`
            ).join('');
            renderizarItens();
        }

        function renderizarItens() {
            const list = document.getElementById('playlist');
            const termoBusca = document.getElementById('search-input').value.toLowerCase();
            const items = allPlaylists[playlistAtualNome] || [];
            
            list.innerHTML = items.map((m, i) => {
                if (!m.titulo.toLowerCase().includes(termoBusca)) return '';
                return `
                    <div class="item ${i === indexAtual ? 'active' : ''}" onclick="tocar(${i})">
                        <img src="${m.type === 'playlist' ? 'https://img.youtube.com/vi_webp/default.jpg' : 'https://img.youtube.com/vi/'+m.id+'/default.jpg'}" onerror="this.src='https://via.placeholder.com/60?text=YT'">
                        <span style="flex-grow:1; font-size: 14px;">${m.titulo}</span>
                        <span onclick="event.stopPropagation(); deletar(${i})" style="padding: 5px; cursor: pointer; color: #555;">✕</span>
                    </div>
                `;
            }).join('');
        }

        function adicionarLink() {
            const input = document.getElementById('input-link');
            const url = input.value;
            if (!url) return;

            const vMatch = url.match(/(?:v=|\/embed\/|\/watch\?v=|\.be\/)([^"&?\/\s]{11})/);
            if (vMatch) {
                allPlaylists[playlistAtualNome].push({ id: vMatch[1], titulo: "Vídeo Adicionado", type: 'video' });
                salvar();
                renderizarItens();
                input.value = "";
                document.getElementById('status').innerText = "Vídeo adicionado!";
            } else {
                alert("Link inválido");
            }
        }
    
        function tocar(index) {
            indexAtual = index;
            const item = allPlaylists[playlistAtualNome][index];
            const player = document.getElementById('player');
            player.src = item.type === 'playlist' ? `https://www.youtube.com/embed/videoseries?list=${item.id}&autoplay=1` : `https://www.youtube.com/embed/${item.id}?autoplay=1`;
            document.getElementById('status').innerText = `Tocando: ${item.titulo}`;
            renderizarItens();
        }

        function trocarTema(tema, btn) {
            document.body.className = tema;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.getElementById('input-link').addEventListener('keypress', (e) => { if(e.key === 'Enter') adicionarLink(); });
        
        function tocarProximo() { const lista = allPlaylists[playlistAtualNome]; if (lista.length === 0) return; indexAtual = (indexAtual + 1 >= lista.length) ? 0 : indexAtual + 1; tocar(indexAtual); }
        function tocarAnterior() { const lista = allPlaylists[playlistAtualNome]; if (lista.length === 0) return; indexAtual = (indexAtual - 1 < 0) ? lista.length - 1 : indexAtual - 1; tocar(indexAtual); }
        function exportarBackup() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allPlaylists)); const download = document.createElement('a'); download.setAttribute("href", dataStr); download.setAttribute("download", "frogify_backup.json"); download.click(); }
        function importarBackup(event) { const file = event.target.files[0]; const reader = new FileReader(); reader.onload = (e) => { allPlaylists = JSON.parse(e.target.result); playlistAtualNome = Object.keys(allPlaylists)[0]; salvar(); renderizarPlaylists(); }; reader.readAsText(file); }
        function mudarPlaylist() { playlistAtualNome = document.getElementById('playlist-selector').value; indexAtual = -1; renderizarItens(); }
        function criarPlaylist() { const input = document.getElementById('new-playlist-name'); const nome = input.value; if (nome && !allPlaylists[nome]) { allPlaylists[nome] = []; playlistAtualNome = nome; salvar(); renderizarPlaylists(); input.value = ""; } }
        function deletar(i) { allPlaylists[playlistAtualNome].splice(i, 1); salvar(); renderizarItens(); }
        function limparPlaylist() { allPlaylists[playlistAtualNome] = []; salvar(); renderizarItens(); }

        renderizarPlaylists();
    </script>
</body>
</html>
